services:
  ros2:
    build:
      context: .
      args:
        UID: "1000"
        GID: "1000"
    image: martijns-arm/ros2-jazzy:latest
    container_name: ros2-jazzy
    hostname: ros2-jazzy
    stdin_open: true
    tty: true
    # network_mode: host werkt NIET op macOS Docker Desktop (poorten landen
    # in de Linux VM, niet op de Mac). Daarom expliciete port mapping:
    ports:
      - "8765:8765"   # foxglove_bridge WebSocket
      - "9090:9090"   # rosbridge (optioneel later)
    environment:
      - DISPLAY=host.docker.internal:0
      - LIBGL_ALWAYS_INDIRECT=1
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    volumes:
      - ../ros2_ws:/home/ros/ros2_ws:rw
      - ../scripts:/home/ros/scripts:ro
      - ../docs:/home/ros/docs:ro
      - ros-cache:/home/ros/.cache
    working_dir: /home/ros/ros2_ws
    command: bash

volumes:
  ros-cache:
