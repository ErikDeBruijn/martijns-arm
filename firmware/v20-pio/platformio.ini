; Martijns arm — v20 PlatformIO project
; Doel: testbare, modulaire firmware ter vervanging van monolithische v19 .ino

[platformio]
default_envs = esp32s3

[env]
framework = arduino
lib_deps =
    janelia-arduino/TMC2209
    fastled/FastLED
build_flags =
    -std=gnu++17
    -Wno-deprecated-declarations
build_unflags =
    -std=gnu++11

; ─── on-target firmware (SparkFun ESP32-S3 Thing Plus) ─────────
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
; SparkFun ESP32-S3 Thing Plus heeft 4 MB flash (NIET 8 MB zoals PIO default).
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = default.csv
; ESP32-S3 USB-CDC settings (zoals in v19 arduino-cli flow):
;   USBMode=hwcdc, CDCOnBoot=cdc
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101
monitor_speed = 115200
monitor_filters = colorize, time

; ─── native unit tests (no hardware) ───────────────────────────
; Pure logica (PID, filters, command-parser, soft-endstops) draait
; native met Unity test framework — geen ESP32 nodig om te runnen.
[env:native]
platform = native
framework =
test_framework = unity
test_build_src = no
lib_deps =
build_flags =
    -std=gnu++17
    -DUNIT_TEST
build_unflags =
    -std=gnu++11
lib_compat_mode = off
